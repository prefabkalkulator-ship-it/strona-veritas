server {
    listen 8080;
    server_name localhost;

    # Kompresja Gzip (drastycznie zmniejsza transfer i koszty egress sieciowego)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Długoterminowy cache dla zasobów Vite z hashami w nazwach (JS, CSS) - 1 rok cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache dla sekwencji klatek WebP (193 klatki scrollytellingu) - 30 dni cache
    location /frames/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Cache dla mediów i grafik statycznych
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Główna aplikacja React SPA - index.html nie cachujemy agresywnie, by aktualizacje kodu były natychmiastowe
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Obsługa błędów
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}